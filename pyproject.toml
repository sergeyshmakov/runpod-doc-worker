# The engine-agnostic half of a RunPod document-processing worker: input
# transport, outbound target checks, response packaging, redaction, structured
# logging and debug probes. Worker repos add an engine and an entry point.
#
# Deliberately light on dependencies. httpx and httpcore are the hard ones —
# transport.net subclasses types from both to build its checked-target
# transport. boto3 is imported inside `package_s3`, so it rides in the `s3`
# extra; torch is imported inside a try/except in `obs.debug`, so it is not a
# dependency at all.
#
# The httpx ceiling is deliberate: transport.net reaches two private APIs
# (`httpx._utils.get_environment_proxies`, `_pool._network_backend`). Guard
# tests cover them here but do not ship, so a consumer must not be resolved
# onto a major release this package has never been run against.

[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "runpod-doc-worker"
version = "0.7.2"
description = "Engine-agnostic harness for RunPod serverless document-processing workers"
readme = "README.md"
# 3.10.12, not 3.10: `tarfile`'s `filter="data"` arrived in that patch
# release (June 2023) and the client's archive extraction depends on it
# outright. The alternative was carrying a hand-written copy of the filter's
# permission rules for eleven superseded patch versions, which is what this
# project did until that copy had produced six separate review findings.
requires-python = ">=3.10.12"
license = { file = "LICENSE" }
authors = [{ name = "Sergei Shmakov" }]
keywords = ["runpod", "serverless", "document-parsing", "ocr", "worker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27,<1",
    "httpcore>=1,<2",
]

[project.urls]
Homepage = "https://github.com/sergeyshmakov/runpod-doc-worker"
Source = "https://github.com/sergeyshmakov/runpod-doc-worker"
Issues = "https://github.com/sergeyshmakov/runpod-doc-worker/issues"

[project.optional-dependencies]
s3 = [
    # Only needed by the `s3` transport in runpod_doc_worker.transport.package.
    "boto3>=1.35",
]
test = [
    "pytest>=7",
    # Test-only. `obs.metrics` never imports opentelemetry at module scope: the
    # consumer supplies the meter, and `Observation` is imported inside the gauge
    # callbacks. Tests need it to assert what those callbacks yield, which is
    # where the "a getter that raises loses its series, not the pipeline"
    # behaviour lives. The api package alone -- not the sdk.
    "opentelemetry-api>=1.20",
]

[tool.hatch.build.targets.wheel]
packages = ["runpod_doc_worker"]

[tool.hatch.build.targets.sdist]
include = [
    "runpod_doc_worker/**",
    # The client distribution's source, so a tag tarball carries both and the
    # `#subdirectory=client` install works from the same URL.
    "client/**",
    "README.md",
    "pyproject.toml",
]
